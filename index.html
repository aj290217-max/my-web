>
                فحص الأسماء
            </button>

            <div id="osintResults" class="osint-results" style="display: none;"></div>
        </div>


        <!-- =========================
             TERMINAL
        ========================= -->
        <div class="terminal-container">
            <div class="terminal-header">
                <span class="terminal-btn btn-red"></span>
                <span class="terminal-btn btn-yellow"></span>
                <span class="terminal-btn btn-green"></span>
                <span class="terminal-title">abdjalil@dark-node:~</span>
            </div>
            <div class="terminal-body" id="terminalBody">
                <p><span class="prompt">system@node:~$</span> welcome --user</p>
                <p style="color: #60a5fa;">[+] Matrix Node initialized. Type 'help' to see available commands.</p>
            </div>
            <div class="terminal-input-line" style="padding: 0 20px 15px;">
                <span class="prompt">abdjalil@root:~$</span>
                <input type="text" id="terminalInput" class="terminal-input" placeholder="Type a command..." onkeydown="handleTerminalCommand(event)">
            </div>
        </div>


        <!-- =========================
             CONTACT & SOCIAL
        ========================= -->
        <section class="contact-section glass">
            <h2 class="section-title" id="contactTitle" style="margin-top:0;">تواصل معي</h2>
            <form class="contact-form" onsubmit="event.preventDefault(); alert('Message sent!');">
                <input type="text" id="inputName" placeholder="الاسم" required>
                <input type="email" id="inputEmail" placeholder="البريد الإلكتروني" required>
                <textarea id="inputMsg" rows="4" placeholder="رسالتك..." required></textarea>
                <button type="submit" id="btnSend">إرسال الرسالة</button>
            </form>
        </section>

        <section class="social">
            <a href="https://github.com" target="_blank">GitHub</a>
            <a href="https://instagram.com" target="_blank">Instagram</a>
            <a href="https://linkedin.com" target="_blank">LinkedIn</a>
        </section>

        <footer>
            <p>© 2026 ABD JALIL. All Rights Reserved. Built with Cyber Spirit.</p>
        </footer>

    </div>

    <!-- Background Music Element -->
    <audio id="bgMusic" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3"></audio>

    <script>
        /* ==========================================
           1. MATRIX CANVAS ANIMATION
        ========================================== */
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz@#$%&*';
        const fontSize = 14;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = Array(columns).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 8, 22, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00f0ff';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 40);


        /* ==========================================
           2. TYPING EFFECT
        ========================================== */
        const typedTextSpan = document.querySelector(".typed-text");
        const textsAr = ["مطور تطبيقات وسكربتات", "مهتم بالأمن السيبراني", "عاشق للرياضة والانضباط"];
        const textsEn = ["Software & Script Developer", "Cybersecurity Enthusiast", "Fitness & Discipline Focused"];
        
        let currentTexts = textsAr;
        let textIndex = 0;
        let charIndex = 0;
        let isDeleting = false;

        function type() {
            const currentString = currentTexts[textIndex];
            
            if (isDeleting) {
                typedTextSpan.textContent = currentString.substring(0, charIndex - 1);
                charIndex--;
            } else {
                typedTextSpan.textContent = currentString.substring(0, charIndex + 1);
                charIndex++;
            }

            let typeSpeed = isDeleting ? 50 : 100;

            if (!isDeleting && charIndex === currentString.length) {
                typeSpeed = 2000;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                textIndex = (textIndex + 1) % currentTexts.length;
                typeSpeed = 500;
            }

            setTimeout(type, typeSpeed);
        }
        document.addEventListener("DOMContentLoaded", () => setTimeout(type, 500));


        /* ==========================================
           3. INSPORA CAROUSEL CONTROLLER
        ========================================== */
        const carousel = document.getElementById('insporaCarousel');
        const cards = carousel.querySelectorAll('.inspora-card');
        let activeIndex = 1; // Start at middle card

        function updateCarousel() {
            cards.forEach((card, index) => {
                card.className = 'inspora-card';
                if (index === activeIndex) {
                    card.classList.add('center');
                } else if (index === activeIndex - 1) {
                    card.classList.add('left');
                } else if (index === activeIndex + 1) {
                    card.classList.add('right');
                } else if (index < activeIndex - 1) {
                    card.classList.add('hidden-left');
                } else {
                    card.classList.add('hidden-right');
                }
            });
        }

        document.getElementById('insporaPrev').addEventListener('click', () => {
            if (activeIndex > 0) {
                activeIndex--;
                updateCarousel();
            }
        });

        document.getElementById('insporaNext').addEventListener('click', () => {
            if (activeIndex < cards.length - 1) {
                activeIndex++;
                updateCarousel();
            }
        });


        /* ==========================================
           4. OSINT TRACKER TOOL
        ========================================== */
        function startOsintScan() {
            const username = document.getElementById('osintUsername').value.trim();
            const resultsDiv = document.getElementById('osintResults');

            if (!username) {
                alert('الرجاء إدخال اسم المستخدم أولاً!');
                return;
            }

            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = `<p style="color: #e2e8f0;">[+] جاري البحث عن الحسابات الخاصة بـ: <b>${username}</b>...</p>`;

            const platforms = [
                { name: 'GitHub', url: `https://github.com/${username}` },
                { name: 'Instagram', url: `https://instagram.com/${username}` },
                { name: 'Twitter/X', url: `https://x.com/${username}` },
                { name: 'Telegram', url: `https://t.me/${username}` },
                { name: 'Reddit', url: `https://reddit.com/user/${username}` }
            ];

            setTimeout(() => {
                let htmlOutput = `<p style="color: #2ea44f; margin-bottom: 10px;">[✓] إكتمال الفحص:</p>`;
                platforms.forEach(p => {
                    htmlOutput += `<a href="${p.url}" target="_blank" class="osint-link">🔗 ${p.name}: ${p.url}</a>`;
                });
                resultsDiv.innerHTML = htmlOutput;
            }, 1200);
        }


        /* ==========================================
           5. TERMINAL COMMAND INTERACTION
        ========================================== */
        function handleTerminalCommand(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('terminalInput');
                const cmd = input.value.trim().toLowerCase();
                const body = document.getElementById('terminalBody');

                const pCmd = document.createElement('p');
                pCmd.innerHTML = `<span class="prompt">abdjalil@root:~$</span> ${input.value}`;
                body.appendChild(pCmd);

                const pRes = document.createElement('p');
                pRes.style.color = '#8ab4ff';

                if (cmd === 'help') {
                    pRes.textContent = 'Available commands: about, skills, osint, clear, contact';
                } else if (cmd === 'about') {
                    pRes.textContent = 'ABD JALIL - Developer & Cybersecurity enthusiast based in Algeria 🇩🇿.';
                } else if (cmd === 'skills') {
                    pRes.textContent = 'Skills: Python, HTML/CSS/JS, OSINT, Linux Administration, Gym Discipline.';
                } else if (cmd === 'clear') {
                    body.innerHTML = '';
                    input.value = '';
                    return;
                } else {
                    pRes.style.color = '#ff5f56';
                    pRes.textContent = `Command not recognized: '${cmd}'. Type 'help' for options.`;
                }

                body.appendChild(pRes);
                body.scrollTop = body.scrollHeight;
                input.value = '';
            }
        }


        /* ==========================================
           6. LANGUAGE SWITCHER (AR / FR-EN)
        ========================================== */
        function switchLanguage(lang) {
            const btnAr = document.getElementById('btnAr');
            const btnFr = document.getElementById('btnFr');

            if (lang === 'ar') {
                document.documentElement.setAttribute('dir', 'rtl');
                document.documentElement.setAttribute('lang', 'ar');
                btnAr.classList.add('active');
                btnFr.classList.remove('active');
                currentTexts = textsAr;

                // Update text content for AR
                document.getElementById('navHome').textContent = 'الرئيسية';
                document.getElementById('navGallery').textContent = 'الصور';
                document.getElementById('navVideo').textContent = 'الفيديو';
                document.getElementById('navOsint').textContent = 'أداة OSINT';
                document.getElementById('aboutTitle').textContent = '// التشخيص النفسي';
                document.getElementById('statAge').textContent = 'العمر';
                document.getElementById('statCountry').textContent = 'الجزائر';
                document.getElementById('statGoalLabel').textContent = 'الهدف الحالي';
                document.getElementById('statViews').textContent = 'زيارات الملف';
                document.getElementById('titlePassions').textContent = 'شغفي واهتماماتي';
                document.getElementById('titleProjects').textContent = 'المشاريع والتطوير';
                document.getElementById('titleGallery').textContent = 'المعرض الخاص بي';
                document.getElementById('osintTitle').textContent = 'أداة تعقب اسم المستخدم 🛠️';
                document.getElementById('osintBtn').textContent = 'فحص الأسماء';
                document.getElementById('contactTitle').textContent = 'تواصل معي';
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
                document.documentElement.setAttribute('lang', 'en');
                btnFr.classList.add('active');
                btnAr.classList.remove('active');
                currentTexts = textsEn;

                // Update text content for EN/FR
                document.getElementById('navHome').textContent = 'Home';
                document.getElementById('navGallery').textContent = 'Gallery';
                document.getElementById('navVideo').textContent = 'Video';
                document.getElementById('navOsint').textContent = 'OSINT Tool';
                document.getElementById('aboutTitle').textContent = '// Self Diagnosis';
                document.getElementById('statAge').textContent = 'Age';
                document.getElementById('statCountry').textContent = 'Algeria';
                document.getElementById('statGoalLabel').textContent = 'Current Goal';
                document.getElementById('statViews').textContent = 'Profile Views';
                document.getElementById('titlePassions').textContent = 'Passions & Interests';
                document.getElementById('titleProjects').textContent = 'Projects & Development';
                document.getElementById('titleGallery').textContent = 'My Gallery';
                document.getElementById('osintTitle').textContent = 'Username OSINT Tracker 🛠️';
                document.getElementById('osintBtn').textContent = 'Scan User';
                document.getElementById('contactTitle').textContent = 'Contact Me';
            }
        }


        /* ==========================================
           7. MUSIC CONTROLLER
        ========================================== */
        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            const btn = document.getElementById('musicControl');
            if (music.paused) {
                music.play();
                btn.textContent = '🎵 Ambiance: ON';
                btn.style.color = '#2ea44f';
            } else {
                music.pause();
                btn.textContent = '🎵 Ambiance: OFF';
                btn.style.color = '#60a5fa';
            }
        }
    </script>
</body>
</html>
